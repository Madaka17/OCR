<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR trial</title>
<style>
  /* Dark is the primary look. Light is used when the system asks for it. */
  :root {
    color-scheme: dark;
    --bg: #0b0f19;
    --panel: #0f1524;
    --card: #111827;
    --border: #1f2937;
    --hover-border: #374151;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --accent: #fbbf24;
    --accent-soft: rgba(251, 191, 36, 0.12);
    --accent-text: #0b0f19;
    --green: #4ade80;
    --amber: #f59e0b;
    --red: #f87171;
    --green-fill: rgba(74, 222, 128, 0.18);
    --amber-fill: rgba(245, 158, 11, 0.2);
    --red-fill: rgba(248, 113, 113, 0.2);
    --match-fill: rgba(250, 204, 21, 0.28);
    --match-strong: rgba(245, 158, 11, 0.6);
    --radius: 10px;
    --chip-radius: 6px;
    --nav-h: 56px;
    --font: "Leelawadee UI", "Segoe UI", Tahoma, sans-serif;
    --mono: ui-monospace, Consolas, "Cascadia Mono", monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #f5f6f8;
      --panel: #ffffff;
      --card: #ffffff;
      --border: #e5e7eb;
      --hover-border: #cbd5e1;
      --text: #111827;
      --muted: #6b7280;
      --accent: #b7791f;
      --accent-soft: rgba(183, 121, 31, 0.12);
      --accent-text: #ffffff;
      --green: #15803d;
      --amber: #b45309;
      --red: #b91c1c;
      --green-fill: rgba(22, 163, 74, 0.2);
      --amber-fill: rgba(245, 158, 11, 0.2);
      --red-fill: rgba(220, 38, 38, 0.16);
      --match-fill: rgba(250, 204, 21, 0.4);
      --match-strong: rgba(245, 158, 11, 0.65);
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f5f6f8;
    --panel: #ffffff;
    --card: #ffffff;
    --border: #e5e7eb;
    --hover-border: #cbd5e1;
    --text: #111827;
    --muted: #6b7280;
    --accent: #b7791f;
    --accent-soft: rgba(183, 121, 31, 0.12);
    --accent-text: #ffffff;
    --green: #15803d;
    --amber: #b45309;
    --red: #b91c1c;
    --green-fill: rgba(22, 163, 74, 0.2);
    --amber-fill: rgba(245, 158, 11, 0.2);
    --red-fill: rgba(220, 38, 38, 0.16);
    --match-fill: rgba(250, 204, 21, 0.4);
    --match-strong: rgba(245, 158, 11, 0.65);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.55;
    overflow-wrap: anywhere;
  }
  p, h1, h2, h3 { margin: 0; }
  .muted { color: var(--muted); font-size: 0.88rem; }
  .mono { font-family: var(--mono); }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    min-width: 0;
  }

  /* ---- navbar ---- */
  .navbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
    min-height: var(--nav-h);
    padding: 8px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; }
  .logo { flex: none; display: block; }
  .logo-bg { fill: var(--accent); }
  .logo-fg {
    fill: none;
    stroke: var(--accent-text);
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .search-wrap {
    flex: 1 1 320px;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    max-width: 680px;
    margin: 0 auto;
  }
  .search-box { position: relative; flex: 1 1 auto; min-width: 0; }
  .search-box input {
    font: inherit;
    font-size: 0.92rem;
    width: 100%;
    padding: 8px 74px 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
  }
  .search-box input::placeholder { color: var(--muted); }
  .search-box input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .kbd {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    font-family: var(--mono);
    font-size: 0.72rem;
    padding: 1px 6px;
    border: 1px solid var(--border);
    border-radius: var(--chip-radius);
    color: var(--muted);
    background: var(--panel);
    pointer-events: none;
    white-space: nowrap;
  }
  .search-count {
    min-width: 3.5em;
    text-align: center;
    color: var(--muted);
    font-size: 0.88rem;
    font-variant-numeric: tabular-nums;
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    padding: 3px 10px;
    border: 1px solid var(--border);
    border-radius: var(--chip-radius);
    color: var(--muted);
    white-space: nowrap;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex: none; }

  /* ---- layout ---- */
  .app { display: block; }
  .sidebar {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 16px;
    min-width: 0;
  }
  .main { padding: 20px 16px 48px; min-width: 0; }

  .tabs {
    display: flex;
    gap: 4px;
    padding: 4px;
    border: 1px solid var(--border);
    border-radius: 999px;
    margin-bottom: 4px;
  }
  .tab {
    flex: 1;
    font: inherit;
    font-size: 0.9rem;
    padding: 6px 12px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .tab.active { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .side-section { padding: 14px 0; border-top: 1px solid var(--border); }
  .panel > .side-section:first-child { border-top: 0; }
  .side-title {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .conf-value { font-family: var(--mono); color: var(--accent); font-size: 0.85rem; }

  /* ---- upload ---- */
  .dropzone {
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    background: var(--card);
    padding: 18px 14px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    outline: none;
  }
  .dropzone:hover,
  .dropzone:focus-visible,
  .dropzone.drag {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .dropzone.busy {
    opacity: 0.6;
    cursor: progress;
    pointer-events: none;
  }
  .dz-title { font-size: 0.92rem; font-weight: 600; }
  .dz-hint { color: var(--muted); font-size: 0.82rem; margin-top: 4px; }

  .status {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 16px;
    color: var(--muted);
    overflow-wrap: anywhere;
  }
  .spinner {
    width: 18px;
    height: 18px;
    flex: none;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2.4s; }
  }
  .error {
    margin: 0 0 16px;
    padding: 12px 16px;
    border-radius: var(--radius);
    background: var(--red-fill);
    color: var(--red);
    font-weight: 500;
  }

  /* ---- chips, buttons, inputs ---- */
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip {
    font: inherit;
    font-size: 0.85rem;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: var(--chip-radius);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
  }
  .chip:hover { border-color: var(--hover-border); }
  .chip.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .chip-check { display: none; font-size: 0.8rem; font-weight: 700; }
  .chip.selected .chip-check { display: inline; }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip:disabled { opacity: 0.5; cursor: not-allowed; }
  .pick-status { color: var(--muted); font-size: 0.85rem; margin: 2px 0 10px; font-variant-numeric: tabular-nums; }
  .range-form { display: flex; gap: 6px; align-items: stretch; }
  .range-input {
    font: inherit;
    font-size: 0.88rem;
    flex: 1;
    min-width: 0;
    padding: 6px 10px;
    border-radius: var(--chip-radius);
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
  }
  .range-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .range-error { color: var(--red); font-size: 0.84rem; margin-top: 6px; }

  .btn {
    font: inherit;
    font-size: 0.9rem;
    padding: 8px 14px;
    border-radius: var(--chip-radius);
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled,
  .btn:disabled:hover {
    opacity: 0.5;
    cursor: not-allowed;
    border-color: var(--border);
    color: var(--text);
  }
  .btn-block { display: block; width: 100%; margin-bottom: 8px; text-align: center; }
  .btn.icon-btn { padding: 4px 12px; font-size: 1.05rem; line-height: 1.2; }
  .filename {
    display: block;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: var(--chip-radius);
    background: var(--card);
    font-family: var(--mono);
    font-size: 0.85rem;
    overflow-wrap: anywhere;
  }
  .sidebar-foot { margin-top: 12px; font-size: 0.8rem; }

  /* ---- switches and slider ---- */
  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 6px 0;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .switch {
    appearance: none;
    -webkit-appearance: none;
    flex: none;
    width: 36px;
    height: 20px;
    margin: 0;
    border-radius: 999px;
    background: var(--border);
    position: relative;
    cursor: pointer;
    transition: background 0.15s;
  }
  .switch::before {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--text);
    transition: transform 0.15s;
  }
  .switch:checked { background: var(--accent); }
  .switch:checked::before { transform: translateX(16px); background: var(--accent-text); }
  .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .conf-slider { width: 100%; margin: 4px 0 0; accent-color: var(--accent); }
  .ticks {
    display: flex;
    justify-content: space-between;
    padding: 0 6px;
    font-size: 0.75rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* ---- results header ---- */
  .result-head { margin-bottom: 16px; }
  .result-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
  .result-title h2 { font-size: 1.2rem; }
  .result-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 4px; }
  .result-sub .mono { font-size: 0.9rem; overflow-wrap: anywhere; }
  .empty-card { text-align: center; padding: 56px 20px; }
  .empty-title { font-weight: 600; }

  /* ---- pages ---- */
  #results { display: grid; gap: 18px; }
  .page-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 6px 12px;
    margin-bottom: 12px;
  }
  .page-title { font-size: 1.05rem; }
  .page-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 8px;
    color: var(--muted);
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
  }
  .page-meta .sep { opacity: 0.6; }
  .match-badge {
    font-size: 0.8rem;
    font-weight: 600;
    padding: 1px 8px;
    border-radius: var(--chip-radius);
    color: var(--amber);
    background: var(--amber-fill);
  }
  .page-body { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  .figure {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .figure img { display: block; width: 100%; height: auto; }
  .hide-images .col-image { display: none; }
  .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  .box {
    stroke-width: 1.5px;
    vector-effect: non-scaling-stroke;
    transition: fill 0.1s, stroke-width 0.1s;
  }
  .box-hi { fill: var(--green-fill); stroke: var(--green); }
  .box-mid { fill: var(--amber-fill); stroke: var(--amber); }
  .box-lo { fill: var(--red-fill); stroke: var(--red); }
  .box.active { stroke-width: 3px; }
  .box-hi.active { fill: rgba(74, 222, 128, 0.42); }
  .box-mid.active { fill: rgba(245, 158, 11, 0.42); }
  .box-lo.active { fill: rgba(248, 113, 113, 0.44); }
  .box.has-match { fill: var(--match-fill); stroke: var(--amber); }
  .box.has-match.active { fill: var(--match-strong); }
  .box.has-match.current { fill: var(--match-strong); stroke-width: 3px; }
  .box.filtered { display: none; }
  body.boxes-off .box:not(.has-match) { display: none; }

  .lines {
    list-style: none;
    margin: 0;
    padding: 0 4px 0 0;
    max-height: 70vh;
    overflow-y: auto;
    display: grid;
    gap: 8px;
  }
  .line {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 10px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg);
    cursor: pointer;
    outline: none;
    transition: border-color 0.12s, background 0.12s;
  }
  .line:hover, .line:focus-visible, .line.active { border-color: var(--hover-border); background: var(--accent-soft); }
  .line.active { border-color: var(--accent); }
  .line.has-match { border-color: var(--amber); }
  .line.copied { border-color: var(--green); }
  .line-text { font-size: 1rem; overflow-wrap: anywhere; word-break: break-word; }
  .line-meta {
    color: var(--muted);
    font-size: 0.8rem;
    font-variant-numeric: tabular-nums;
  }
  .conf { font-weight: 600; }
  .conf-hi { color: var(--green); }
  .conf-mid { color: var(--amber); }
  .conf-lo { color: var(--red); }
  mark {
    background: var(--match-fill);
    color: inherit;
    border-radius: 3px;
    padding: 0 1px;
  }
  mark.current {
    background: var(--match-strong);
    box-shadow: 0 0 0 2px var(--amber);
  }
  .empty { color: var(--muted); padding: 10px 12px; }

  /* ---- responsive ---- */
  @media (max-width: 899px) {
    .search-wrap { order: 3; flex: 1 1 100%; max-width: none; margin: 0; }
    .status-pill { order: 2; }
  }
  @media (min-width: 900px) {
    :root { --nav-h: 56px; }
    .navbar { flex-wrap: nowrap; height: var(--nav-h); }
    .app { display: grid; grid-template-columns: 360px minmax(0, 1fr); align-items: start; }
    .sidebar {
      position: sticky;
      top: var(--nav-h);
      height: calc(100vh - var(--nav-h));
      overflow-y: auto;
      border-right: 1px solid var(--border);
      border-bottom: 0;
    }
    .main { padding: 24px 28px 56px; }
  }
  @media (min-width: 1200px) {
    body:not(.hide-images) .page-body { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; }
  }
</style>
</head>
<body>
<header class="navbar">
  <div class="brand">
    <svg class="logo" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
      <rect class="logo-bg" x="0" y="0" width="28" height="28" rx="7"/>
      <path class="logo-fg" d="M8 6.5h8.5L20 10v11.5H8z"/>
      <path class="logo-fg" d="M11 14h6M11 17.5h4.5"/>
    </svg>
    <span class="brand-name">OCR trial</span>
  </div>

  <div class="search-wrap">
    <div class="search-box">
      <input id="search-input" type="search" placeholder="ค้นหาข้อความในผลลัพธ์…" aria-label="ค้นหาข้อความในผลลัพธ์" autocomplete="off">
      <kbd class="kbd" aria-hidden="true">Ctrl K</kbd>
    </div>
    <span id="search-count" class="search-count" aria-live="polite"></span>
    <button id="prev-btn" class="btn icon-btn" type="button" aria-label="ผลก่อนหน้า" disabled>‹</button>
    <button id="next-btn" class="btn icon-btn" type="button" aria-label="ผลถัดไป" disabled>›</button>
  </div>

  <span class="status-pill"><span class="dot" aria-hidden="true"></span>โมเดลพร้อม</span>
</header>

<div class="app">
  <aside class="sidebar" aria-label="ตัวกรองและเครื่องมือ">
    <div class="tabs" role="tablist">
      <button id="tab-main" class="tab active" type="button" role="tab" aria-selected="true" aria-controls="panel-main">หลัก</button>
      <button id="tab-export" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-export">ส่งออก</button>
    </div>

    <section id="panel-main" class="panel" role="tabpanel" aria-labelledby="tab-main">
      <div class="side-section">
        <h3 class="side-title">อัปโหลด</h3>
        <div id="dropzone" class="dropzone" role="button" tabindex="0" aria-label="ลากไฟล์มาวางหรือคลิกเพื่อเลือกไฟล์">
          <p class="dz-title">ลากไฟล์มาวาง หรือคลิกเพื่อเลือก</p>
          <p class="dz-hint">PNG, JPG, PDF · Ctrl+V วางรูป</p>
        </div>
        <input id="file-input" type="file" accept="image/*,.pdf,application/pdf" hidden>
      </div>

      <div class="side-section">
        <h3 class="side-title">หน้า</h3>
        <div id="page-chips" class="chip-row"></div>
        <div class="chip-row">
          <button id="select-all-btn" class="chip" type="button">เลือกทั้งหมด</button>
          <button id="select-none-btn" class="chip" type="button">ไม่เลือกเลย</button>
        </div>
        <p id="pick-status" class="pick-status" aria-live="polite"></p>
        <div class="range-form">
          <input id="range-input" class="range-input" type="text" placeholder="เช่น 1-3, 5" aria-label="ช่วงหน้า">
          <button id="apply-btn" class="btn" type="button">ใช้</button>
        </div>
        <p id="range-error" class="range-error" role="alert" hidden></p>
      </div>

      <div class="side-section">
        <h3 class="side-title">
          <span>ความมั่นใจขั้นต่ำ</span>
          <output id="conf-value" class="conf-value" for="conf-slider">0%</output>
        </h3>
        <input id="conf-slider" class="conf-slider" type="range" min="0" max="3" step="1" value="0" aria-label="ความมั่นใจขั้นต่ำ">
        <div class="ticks" aria-hidden="true"><span>0%</span><span>50%</span><span>70%</span><span>90%</span></div>
        <p id="hidden-count" class="muted" hidden></p>
      </div>

      <div class="side-section">
        <h3 class="side-title">การแสดงผล</h3>
        <label class="switch-row"><span>แสดงกรอบข้อความ</span><input id="toggle-boxes" class="switch" type="checkbox" checked></label>
        <label class="switch-row"><span>แสดงรูปหน้า</span><input id="toggle-images" class="switch" type="checkbox" checked></label>
      </div>
    </section>

    <section id="panel-export" class="panel" role="tabpanel" aria-labelledby="tab-export" hidden>
      <div class="side-section">
        <h3 class="side-title">ส่งออก</h3>
        <button id="copy-btn" class="btn btn-block" type="button" disabled>คัดลอกหน้าที่เลือก</button>
        <button id="download-btn" class="btn btn-block" type="button" disabled>ดาวน์โหลด .txt</button>
        <p id="export-summary" class="pick-status"></p>
        <h3 class="side-title">ชื่อไฟล์ที่จะใช้</h3>
        <code id="export-name" class="filename"></code>
      </div>
    </section>

    <p class="sidebar-foot muted">ไฟล์ถูกประมวลผลในหน่วยความจำ ไม่ถูกเก็บไว้บนเซิร์ฟเวอร์</p>
  </aside>

  <main class="main">
    <div id="empty-state" class="card empty-card">
      <p class="empty-title">ยังไม่มีไฟล์ — อัปโหลดรูปหรือ PDF จากแถบด้านซ้าย</p>
    </div>

    <div id="status" class="status" role="status" hidden>
      <span class="spinner" aria-hidden="true"></span>
      <span id="status-text"></span>
    </div>
    <div id="error" class="error" role="alert" hidden></div>

    <header id="result-head" class="result-head" hidden>
      <div class="result-title">
        <h2>ผลลัพธ์</h2>
        <span id="res-count" class="muted"></span>
      </div>
      <div class="result-sub">
        <span id="res-file" class="mono"></span>
        <span id="res-meta" class="muted"></span>
      </div>
    </header>

    <div id="results"></div>
  </main>
</div>

<script>
(function () {
  "use strict";

  var SVG_NS = "http://www.w3.org/2000/svg";
  var COPY_SELECTED_LABEL = "คัดลอกหน้าที่เลือก";
  // The confidence slider has four stops; index 0..3 maps to these thresholds.
  var STOPS = [0, 0.5, 0.7, 0.9];
  var dropzone = document.getElementById("dropzone");
  var fileInput = document.getElementById("file-input");
  var statusBox = document.getElementById("status");
  var statusText = document.getElementById("status-text");
  var errorBox = document.getElementById("error");
  var results = document.getElementById("results");
  var emptyState = document.getElementById("empty-state");
  var resultHead = document.getElementById("result-head");
  var pageChips = document.getElementById("page-chips");
  var busy = false;

  // Controls that live in the navbar and sidebar. They exist once, from page load.
  var ui = {
    searchInput: document.getElementById("search-input"),
    countEl: document.getElementById("search-count"),
    prevBtn: document.getElementById("prev-btn"),
    nextBtn: document.getElementById("next-btn"),
    copyBtn: document.getElementById("copy-btn"),
    downloadBtn: document.getElementById("download-btn"),
    exportSummary: document.getElementById("export-summary"),
    exportName: document.getElementById("export-name"),
    pickStatus: document.getElementById("pick-status"),
    selectAllBtn: document.getElementById("select-all-btn"),
    selectNoneBtn: document.getElementById("select-none-btn"),
    rangeInput: document.getElementById("range-input"),
    applyBtn: document.getElementById("apply-btn"),
    rangeError: document.getElementById("range-error"),
    confSlider: document.getElementById("conf-slider"),
    confValue: document.getElementById("conf-value"),
    hiddenCount: document.getElementById("hidden-count"),
    boxesToggle: document.getElementById("toggle-boxes"),
    imagesToggle: document.getElementById("toggle-images"),
    resCount: document.getElementById("res-count"),
    resFile: document.getElementById("res-file"),
    resMeta: document.getElementById("res-meta")
  };

  // State for the currently rendered result.
  var currentData = null;  // the server response
  var views = [];          // one per page: {page, check, chip, badge, lines, section, svg}
  var matches = [];        // one entry per visible match: the line record it lives in
  var current = -1;        // index into matches of the highlighted match
  var query = "";          // search text, kept across new results
  var searchTimer = null;
  var minConf = 0;         // lines below this confidence are hidden

  // Build an HTML element. Strings are always set as text, never as markup.
  function h(tag, attrs) {
    var node = document.createElement(tag);
    var children = Array.prototype.slice.call(arguments, 2);
    Object.keys(attrs || {}).forEach(function (key) {
      var value = attrs[key];
      if (value === undefined || value === null || value === false) return;
      if (key === "text") node.textContent = value;
      else if (key === "class") node.className = value;
      else if (key === "checked") node.checked = !!value;
      else node.setAttribute(key, value === true ? "" : String(value));
    });
    children.forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function tier(conf) {
    return conf >= 0.9 ? "hi" : conf >= 0.7 ? "mid" : "lo";
  }

  function flash(btn, message, original) {
    btn.textContent = message;
    setTimeout(function () { btn.textContent = original; }, 1600);
  }

  function setBusy(on) {
    busy = on;
    dropzone.classList.toggle("busy", on);
    dropzone.setAttribute("aria-disabled", on ? "true" : "false");
    dropzone.tabIndex = on ? -1 : 0;
  }

  function showError(message) {
    errorBox.textContent = "เกิดข้อผิดพลาด: " + message;
    errorBox.hidden = false;
  }

  function copyLine(text, row) {
    navigator.clipboard.writeText(text).then(function () {
      row.classList.add("copied");
      setTimeout(function () { row.classList.remove("copied"); }, 900);
    }, function () {});
  }

  // @logic-begin
  // Pure helpers, no DOM access. The scratchpad test script runs this exact block.
  var WS = /\s/;

  // Drop whitespace and lowercase. For every kept character, remember the index
  // of the original character it came from so match positions can be mapped back.
  function normalizeWithMap(s) {
    var out = "";
    var map = [];
    for (var i = 0; i < s.length; i++) {
      var ch = s.charAt(i);
      if (WS.test(ch)) continue;
      var lower = ch.toLowerCase();
      for (var k = 0; k < lower.length; k++) {
        out += lower.charAt(k);
        map.push(i);
      }
    }
    return { text: out, map: map };
  }

  // All non-overlapping matches of query in lineText, as [start, end) indexes
  // into the original lineText. Whitespace is ignored on both sides.
  function findMatches(lineText, query) {
    var needle = normalizeWithMap(query).text;
    if (!needle) return [];
    var hay = normalizeWithMap(lineText);
    var found = [];
    var at = hay.text.indexOf(needle);
    while (at !== -1) {
      var start = hay.map[at];
      var end = hay.map[at + needle.length - 1] + 1;
      // Keep trailing combining marks (Thai vowels and tone marks) with their base.
      while (end < lineText.length && /^\p{M}/u.test(lineText.slice(end, end + 2))) end++;
      // Lowercasing can expand one character into two; skip matches that overlap the previous one.
      if (!found.length || start >= found[found.length - 1].end) {
        found.push({ start: start, end: end });
      }
      at = hay.text.indexOf(needle, at + needle.length);
    }
    return found;
  }

  // Thai digits, full-width digits and dash variants -> ASCII digits and "-".
  function normalizeRangeText(s) {
    return s.replace(/[๐-๙０-９]/g, function (ch) {
      var code = ch.charCodeAt(0);
      return String.fromCharCode(code <= 0x0E59 ? code - 0xE50 + 48 : code - 0xFF10 + 48);
    }).replace(/[–—−－]/g, "-");
  }

  // "1-3, 5" -> [1,2,3,5]. Reversed ranges are swapped, numbers outside 1..total
  // are ignored. Returns null when the text is not a valid list.
  function parsePageRange(text, total) {
    var parts = normalizeRangeText(String(text)).split(",");
    var seen = {};
    var valid = 0;
    for (var i = 0; i < parts.length; i++) {
      var t = parts[i].replace(/\s+/g, "");
      if (t === "") continue;
      var m = /^(\d+)(?:-(\d+))?$/.exec(t);
      if (!m) return null;
      var a = parseInt(m[1], 10);
      var b = m[2] === undefined ? a : parseInt(m[2], 10);
      if (a > b) { var tmp = a; a = b; b = tmp; }
      valid++;
      for (var p = Math.max(1, a); p <= Math.min(total, b); p++) seen[p] = true;
    }
    if (!valid) return null;
    var pages = [];
    for (var n = 1; n <= total; n++) if (seen[n]) pages.push(n);
    return pages;
  }

  // [1,2,3,5] -> "1-3_5"
  function compactRanges(pages) {
    var sorted = pages.slice().sort(function (x, y) { return x - y; })
      .filter(function (v, idx, arr) { return idx === 0 || v !== arr[idx - 1]; });
    var parts = [];
    var i = 0;
    while (i < sorted.length) {
      var j = i;
      while (j + 1 < sorted.length && sorted[j + 1] === sorted[j] + 1) j++;
      parts.push(j > i ? sorted[i] + "-" + sorted[j] : String(sorted[i]));
      i = j + 1;
    }
    return parts.join("_");
  }

  // All pages selected -> "<name>.txt"; otherwise "<name>.p<ranges>.txt".
  function downloadName(filename, pages, total) {
    if (pages.length === total) return filename + ".txt";
    return filename + ".p" + compactRanges(pages) + ".txt";
  }
  // @logic-end

  // Rebuild a line's text node content: plain text, or text with <mark> spans.
  function paintText(el, text, ranges) {
    el.replaceChildren();
    if (!ranges.length) {
      el.textContent = text;
      return;
    }
    var pos = 0;
    ranges.forEach(function (r) {
      if (r.start > pos) el.appendChild(document.createTextNode(text.slice(pos, r.start)));
      el.appendChild(h("mark", { class: r.current ? "current" : null, text: text.slice(r.start, r.end) }));
      pos = r.end;
    });
    if (pos < text.length) el.appendChild(document.createTextNode(text.slice(pos)));
  }

  function dot() {
    return h("span", { class: "sep", "aria-hidden": "true", text: "•" });
  }

  function renderPage(page) {
    var svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("class", "overlay");
    svg.setAttribute("viewBox", "0 0 " + page.width + " " + page.height);
    svg.setAttribute("preserveAspectRatio", "none");
    svg.setAttribute("aria-hidden", "true");

    var list = h("ul", { class: "lines" });
    var view = { page: page, lines: [], check: null, chip: null, badge: null, section: null, svg: svg };

    page.lines.forEach(function (line, idx) {
      var t = tier(line.confidence);

      var poly = document.createElementNS(SVG_NS, "polygon");
      poly.setAttribute("points", line.box.map(function (p) { return p[0] + "," + p[1]; }).join(" "));
      poly.setAttribute("class", "box box-" + t);
      svg.appendChild(poly);

      var textEl = h("span", { class: "line-text", text: line.text });
      var row = h("li", { class: "line", tabindex: "0", title: "คลิกเพื่อคัดลอกบรรทัดนี้" },
        textEl,
        h("span", { class: "line-meta" },
          h("span", { text: "หน้า " + page.number + " • บรรทัด " + (idx + 1) + " • ความมั่นใจ " }),
          h("span", { class: "conf conf-" + t, text: Math.round(line.confidence * 100) + "%" })));
      list.appendChild(row);

      var rec = { line: line, row: row, textEl: textEl, poly: poly, ranges: [] };
      view.lines.push(rec);

      function setActive(on) {
        row.classList.toggle("active", on);
        poly.classList.toggle("active", on);
      }
      row.addEventListener("mouseenter", function () { setActive(true); });
      row.addEventListener("mouseleave", function () { setActive(false); });
      row.addEventListener("focus", function () { setActive(true); });
      row.addEventListener("blur", function () { setActive(false); });
      row.addEventListener("click", function () { copyLine(line.text, row); });
      row.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          copyLine(line.text, row);
        }
      });
      poly.addEventListener("mouseenter", function () {
        setActive(true);
        row.scrollIntoView({ block: "nearest" });
      });
      poly.addEventListener("mouseleave", function () { setActive(false); });
    });

    if (!page.lines.length) {
      list.appendChild(h("li", { class: "empty", text: "ไม่พบข้อความในหน้านี้" }));
    }

    // The checkbox is the state behind the page chip. It is not shown.
    view.check = h("input", { type: "checkbox", checked: true });
    view.chip = h("button", { class: "chip", type: "button", "aria-pressed": "true" },
      h("span", { class: "chip-check", "aria-hidden": "true", text: "✓" }),
      h("span", { text: "หน้า " + page.number }));
    view.chip.addEventListener("click", function () {
      view.check.checked = !view.check.checked;
      updatePickUI();
    });
    view.badge = h("span", { class: "match-badge", hidden: true });

    var figure = h("div", { class: "figure" },
      h("img", { src: page.image, alt: "หน้า " + page.number }),
      svg);

    view.section = h("section", { class: "card page-card" },
      h("div", { class: "page-head" },
        h("h2", { class: "page-title", text: "หน้า " + page.number }),
        h("p", { class: "page-meta" },
          h("span", { text: page.lines.length + " บรรทัด" }), dot(),
          h("span", { text: page.seconds.toFixed(2) + " วินาที" }), dot(),
          view.badge)),
      h("div", { class: "page-body" },
        h("div", { class: "col-image" }, figure),
        h("div", { class: "col-lines" }, list)));
    return view;
  }

  // ---- page selection ----

  function selectedViews() {
    return views.filter(function (v) { return v.check.checked; });
  }

  // Text of the checked pages. When every page is checked, use the server's full text.
  function selectedText() {
    var picked = selectedViews();
    if (picked.length === views.length) return currentData.text;
    return picked.map(function (v) { return v.page.text; }).join("\n\n");
  }

  function updatePickUI() {
    var picked = selectedViews();
    var n = picked.length;
    views.forEach(function (v) {
      v.chip.classList.toggle("selected", v.check.checked);
      v.chip.setAttribute("aria-pressed", v.check.checked ? "true" : "false");
    });
    var summary = currentData ? "เลือก " + n + " จาก " + views.length + " หน้า" : "";
    ui.pickStatus.textContent = summary;
    ui.exportSummary.textContent = summary;
    ui.exportName.textContent = currentData && n
      ? downloadName(currentData.filename, picked.map(function (v) { return v.page.number; }), views.length)
      : "";
    ui.copyBtn.disabled = n === 0;
    ui.downloadBtn.disabled = n === 0;
  }

  function setAllChecked(on) {
    views.forEach(function (v) { v.check.checked = on; });
    updatePickUI();
  }

  function applyRange() {
    if (!views.length) return;
    var pages = parsePageRange(ui.rangeInput.value, views.length);
    if (pages === null) {
      ui.rangeError.textContent = "รูปแบบไม่ถูกต้อง";
      ui.rangeError.hidden = false;
      return;
    }
    if (pages.length === 0) {
      ui.rangeError.textContent = "ไม่มีหน้าที่ตรงกับช่วงที่ระบุ";
      ui.rangeError.hidden = false;
      return;
    }
    ui.rangeError.hidden = true;
    views.forEach(function (v) { v.check.checked = pages.indexOf(v.page.number) !== -1; });
    updatePickUI();
  }

  // ---- search and confidence filter ----

  // Re-applies the query and the confidence threshold. Lines below the
  // threshold are hidden (row and polygon), and their matches are not counted.
  // Compare on the rounded percent the row displays, so a line shown as
  // "90%" is never hidden by the 90% stop.
  function shown(rec) {
    return Math.round(rec.line.confidence * 100) >= Math.round(minConf * 100);
  }

  function runSearch() {
    matches = [];
    var hiddenLines = 0;
    views.forEach(function (view) {
      view.lines.forEach(function (rec) {
        var visible = shown(rec);
        if (!visible) hiddenLines++;
        rec.ranges = visible ? findMatches(rec.line.text, query).map(function (m) {
          matches.push(rec);
          return { start: m.start, end: m.end, index: matches.length - 1, current: false };
        }) : [];
      });
    });

    if (!matches.length) current = -1;
    else if (current < 0 || current >= matches.length) current = 0;

    views.forEach(function (view) {
      var count = 0;
      view.lines.forEach(function (rec) {
        var show = shown(rec);
        var on = rec.ranges.length > 0;
        rec.row.hidden = !show;
        rec.poly.classList.toggle("filtered", !show);
        rec.row.classList.toggle("has-match", on);
        rec.poly.classList.toggle("has-match", on);
        rec.ranges.forEach(function (r) { r.current = r.index === current; });
        rec.poly.classList.toggle("current", rec.ranges.some(function (r) { return r.current; }));
        paintText(rec.textEl, rec.line.text, rec.ranges);
        count += rec.ranges.length;
      });
      view.badge.textContent = "พบ " + count;
      view.badge.hidden = count === 0;
    });

    var hasNeedle = normalizeWithMap(query).text !== "";
    ui.countEl.textContent = !hasNeedle ? "" : matches.length ? (current + 1) + " / " + matches.length : "ไม่พบ";
    ui.prevBtn.disabled = matches.length === 0;
    ui.nextBtn.disabled = matches.length === 0;

    ui.hiddenCount.textContent = "ซ่อน " + hiddenLines + " บรรทัด";
    ui.hiddenCount.hidden = hiddenLines === 0;
  }

  function focusCurrent() {
    if (current < 0) return;
    matches[current].row.scrollIntoView({ block: "center", behavior: "smooth" });
  }

  function applyQuery() {
    query = ui.searchInput.value;
    current = 0;
    runSearch();
    focusCurrent();
  }

  function step(delta) {
    if (!matches.length) return;
    current = (current + delta + matches.length) % matches.length;
    runSearch();
    focusCurrent();
  }

  function clearResults() {
    clearTimeout(searchTimer);
    searchTimer = null;
    results.replaceChildren();
    pageChips.replaceChildren();
    resultHead.hidden = true;
    currentData = null;
    views = [];
    matches = [];
    current = -1;
    ui.countEl.textContent = "";
    ui.prevBtn.disabled = true;
    ui.nextBtn.disabled = true;
    ui.hiddenCount.hidden = true;
    ui.rangeError.hidden = true;
    updatePickUI();
  }

  function renderResult(data) {
    clearTimeout(searchTimer);
    searchTimer = null;
    results.replaceChildren();
    pageChips.replaceChildren();
    emptyState.hidden = true;
    currentData = data;
    views = [];
    matches = [];
    current = -1;
    var total = data.pages.reduce(function (sum, p) { return sum + p.seconds; }, 0);
    var lineCount = data.pages.reduce(function (n, p) { return n + p.lines.length; }, 0);

    ui.resCount.textContent = lineCount + " บรรทัด";
    ui.resFile.textContent = data.filename;
    ui.resMeta.textContent = data.pages.length + " หน้า · " + total.toFixed(2) + " วินาที";
    resultHead.hidden = false;

    data.pages.forEach(function (page) {
      var view = renderPage(page);
      views.push(view);
      pageChips.appendChild(view.chip);
      results.appendChild(view.section);
    });

    updatePickUI();
    runSearch();
  }

  function upload(file) {
    if (busy) return;
    if (file.size > 50 * 1024 * 1024) {
      showError("ไฟล์ใหญ่เกิน 50 MB");
      return;
    }
    var name = file.name || "clipboard.png";
    setBusy(true);
    errorBox.hidden = true;
    emptyState.hidden = true;
    clearResults();
    statusText.textContent = "กำลังอ่าน " + name + " …";
    statusBox.hidden = false;

    var request = fetch("/ocr", {
      method: "POST",
      body: file,
      headers: { "X-Filename": encodeURIComponent(name) }
    });

    return request.then(function (res) {
      return res.json().catch(function () { return null; }).then(function (data) {
        if (!res.ok || !data || data.error) {
          throw new Error((data && data.error) || "HTTP " + res.status);
        }
        return data;
      });
    }, function () {
      throw new Error("เชื่อมต่อกับเซิร์ฟเวอร์ไม่ได้");
    }).then(function (data) {
      renderResult(data);
    }).catch(function (err) {
      showError(err.message);
    }).then(function () {
      statusBox.hidden = true;
      if (!currentData) emptyState.hidden = false;
      setBusy(false);
    });
  }

  // ---- wiring (once, the controls are static) ----

  ui.searchInput.addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      searchTimer = null;
      applyQuery();
    }, 150);
  });
  ui.searchInput.addEventListener("keydown", function (e) {
    var composing = e.isComposing || e.keyCode === 229;
    if (e.key !== "Enter" || composing) return;
    e.preventDefault();
    if (searchTimer !== null) {
      clearTimeout(searchTimer);
      searchTimer = null;
      applyQuery();
      return;
    }
    step(e.shiftKey ? -1 : 1);
  });
  ui.prevBtn.addEventListener("click", function () { step(-1); });
  ui.nextBtn.addEventListener("click", function () { step(1); });

  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && !e.altKey && typeof e.key === "string" && e.key.toLowerCase() === "k") {
      e.preventDefault();
      ui.searchInput.focus();
      ui.searchInput.select();
    }
  });

  var tabs = [document.getElementById("tab-main"), document.getElementById("tab-export")];
  var panels = [document.getElementById("panel-main"), document.getElementById("panel-export")];
  tabs.forEach(function (tab, i) {
    tab.addEventListener("click", function () {
      tabs.forEach(function (t, j) {
        var on = i === j;
        t.classList.toggle("active", on);
        t.setAttribute("aria-selected", on ? "true" : "false");
        panels[j].hidden = !on;
      });
    });
  });

  ui.copyBtn.addEventListener("click", function () {
    if (!selectedViews().length) return;
    navigator.clipboard.writeText(selectedText()).then(function () {
      flash(ui.copyBtn, "คัดลอกแล้ว ✓", COPY_SELECTED_LABEL);
    }, function () {
      flash(ui.copyBtn, "คัดลอกไม่สำเร็จ", COPY_SELECTED_LABEL);
    });
  });

  ui.downloadBtn.addEventListener("click", function () {
    var picked = selectedViews();
    if (!picked.length) return;
    var blob = new Blob([selectedText()], { type: "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var name = downloadName(currentData.filename, picked.map(function (v) { return v.page.number; }), currentData.pages.length);
    var a = h("a", { href: url, download: name });
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

  ui.selectAllBtn.addEventListener("click", function () { setAllChecked(true); });
  ui.selectNoneBtn.addEventListener("click", function () { setAllChecked(false); });
  ui.applyBtn.addEventListener("click", applyRange);
  ui.rangeInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.isComposing) {
      e.preventDefault();
      applyRange();
    }
  });
  ui.rangeInput.addEventListener("input", function () { ui.rangeError.hidden = true; });

  ui.confSlider.addEventListener("input", function () {
    minConf = STOPS[parseInt(ui.confSlider.value, 10)] || 0;
    ui.confValue.textContent = Math.round(minConf * 100) + "%";
    // Stay on the same match if it survives; else the next visible one after it.
    var prev = current >= 0 ? matches[current] : null;
    var prevAt = current;
    runSearch();
    if (prev && matches.length) {
      var same = matches.indexOf(prev);
      if (same < 0) {
        // Old index counted hidden matches too; first survivor at or after it.
        current = Math.min(prevAt, matches.length - 1);
        runSearch();
      } else if (same !== current) {
        current = same;
        runSearch();
      }
      focusCurrent();
    }
  });

  ui.boxesToggle.addEventListener("change", function () {
    document.body.classList.toggle("boxes-off", !ui.boxesToggle.checked);
  });
  ui.imagesToggle.addEventListener("change", function () {
    document.body.classList.toggle("hide-images", !ui.imagesToggle.checked);
  });

  updatePickUI();

  dropzone.addEventListener("click", function () {
    if (!busy) fileInput.click();
  });
  dropzone.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && !busy) {
      e.preventDefault();
      fileInput.click();
    }
  });
  ["dragenter", "dragover"].forEach(function (type) {
    dropzone.addEventListener(type, function (e) {
      e.preventDefault();
      if (!busy) dropzone.classList.add("drag");
    });
  });
  dropzone.addEventListener("dragleave", function () {
    dropzone.classList.remove("drag");
  });
  dropzone.addEventListener("drop", function (e) {
    e.preventDefault();
    dropzone.classList.remove("drag");
    if (busy) return;
    var file = e.dataTransfer.files[0];
    if (file) upload(file);
  });
  // Stop the browser from opening a file dropped outside the drop zone.
  window.addEventListener("dragover", function (e) { e.preventDefault(); });
  window.addEventListener("drop", function (e) { e.preventDefault(); });

  fileInput.addEventListener("change", function () {
    var file = fileInput.files[0];
    fileInput.value = "";
    if (file) upload(file);
  });

  document.addEventListener("paste", function (e) {
    if (busy || !e.clipboardData) return;
    var items = Array.prototype.slice.call(e.clipboardData.items || []);
    var item = items.find(function (it) { return it.kind === "file" && it.type.indexOf("image/") === 0; });
    if (!item) return;
    e.preventDefault();
    var file = item.getAsFile();
    if (file) upload(file);
  });
})();
</script>
</body>
</html>
