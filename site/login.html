<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="js/theme.js"></script>
<title>เข้าสู่ระบบ · Thai OCR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/theme.css">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow-x: hidden;
    background: linear-gradient(160deg, var(--panel) 0%, var(--primary-soft) 100%), var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.55;
    overflow-wrap: anywhere;
  }
  .streaks {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .streak {
    position: absolute;
    left: -20%;
    width: 140%;
    height: 2px;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 30%, transparent), transparent);
    transform: rotate(-30deg);
  }
  .streak:nth-child(1) { top: 14%; height: 1px; }
  .streak:nth-child(2) { top: 32%; left: -35%; }
  .streak:nth-child(3) { top: 50%; height: 3px; }
  .streak:nth-child(4) { top: 68%; height: 1px; left: -10%; }
  .streak:nth-child(5) { top: 86%; }
  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    color: var(--text-2);
    cursor: pointer;
  }
  .theme-toggle:hover { border-color: var(--hover-border); color: var(--text); }
  .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .theme-toggle .icon-sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
  .login-col {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .avatar {
    width: 72px;
    height: 72px;
    margin-bottom: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--primary);
    color: var(--accent-text);
    box-shadow: var(--shadow);
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
  .muted { margin: 0 0 24px; color: var(--muted); font-size: 0.92rem; }
  form { width: 100%; }
  .field { display: flex; align-items: center; gap: 12px; width: 100%; }
  .field-icon { flex: none; display: flex; color: var(--primary); }
  input[type="password"] {
    font: inherit;
    flex: 1;
    min-width: 0;
    min-height: 48px;
    padding: 10px 4px;
    font-size: 1rem;
    background: transparent;
    color: var(--text);
    border: 0;
    border-bottom: 2px solid var(--muted);
    border-radius: 0;
    transition: border-color .18s;
  }
  input[type="password"]:focus { outline: none; border-bottom-color: var(--primary); }
  input[type="password"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .hint { margin: 8px 0 0; text-align: right; color: var(--muted); font-size: 0.8rem; }
  .btn {
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    width: 100%;
    min-height: 48px;
    margin-top: 28px;
    padding: 10px 14px;
    border: 0;
    border-radius: 999px;
    background: var(--primary);
    color: var(--accent-text);
    cursor: pointer;
    transition: background-color .18s;
  }
  .btn:hover { background: var(--primary-hover); }
  .btn:disabled { opacity: 0.6; cursor: progress; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .error {
    width: 100%;
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: var(--radius);
    background: var(--red-fill);
    color: var(--red);
    font-weight: 500;
    font-size: 0.92rem;
  }
  @media (prefers-reduced-motion: reduce) {
    .btn, input[type="password"] { transition: none; }
  }
</style>
</head>
<body>
<div class="streaks" aria-hidden="true">
  <span class="streak" aria-hidden="true"></span>
  <span class="streak" aria-hidden="true"></span>
  <span class="streak" aria-hidden="true"></span>
  <span class="streak" aria-hidden="true"></span>
  <span class="streak" aria-hidden="true"></span>
</div>
<button type="button" class="theme-toggle" data-theme-toggle aria-label="เปลี่ยนเป็นโหมดมืด" aria-pressed="false">
  <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
</button>
<main class="login-col">
  <div class="avatar" aria-hidden="true">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
  </div>
  <h1 class="sr-only">เข้าสู่ระบบ</h1>
  <p class="muted" id="intro">กรุณาใส่รหัสผ่านเพื่อใช้งาน</p>

  <form id="login-form">
    <div class="field">
      <span class="field-icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </span>
      <label for="password" class="sr-only">รหัสผ่าน</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    </div>
    <p class="hint">ลืมรหัสผ่าน ติดต่อผู้ดูแล</p>
    <button id="submit-btn" class="btn" type="submit">เข้าสู่ระบบ</button>
  </form>
  <p id="error" class="error" role="alert" hidden></p>
</main>

<script>
(function () {
  "use strict";

  var params = new URLSearchParams(location.search);
  var adminMode = params.get("admin") === "1";
  var form = document.getElementById("login-form");
  var passwordInput = document.getElementById("password");
  var submitBtn = document.getElementById("submit-btn");
  var errorBox = document.getElementById("error");
  var intro = document.getElementById("intro");

  if (adminMode) intro.textContent = "กรุณาใส่รหัสผ่านผู้ดูแลระบบ";

  // Same logic as JobsClient.safeNext in js/jobs_client.js (kept inline because the login page
  // is public and /js/jobs_client.js needs a session). Tab, CR, LF and backslash are rejected
  // because browsers strip the first three from URLs, which would turn "/<TAB>/x" into "//x".
  function safeNext(value, origin) {
    if (typeof value !== "string" || value.charAt(0) !== "/") return "/";
    if (/[\x5c\x09\x0a\x0d]/.test(value)) return "/";
    var u;
    try {
      u = new URL(value, origin);
    } catch (err) {
      return "/";
    }
    if (u.origin !== origin) return "/";
    return u.pathname + u.search + u.hash;
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.hidden = false;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var password = passwordInput.value;
    if (!password) return;
    errorBox.hidden = true;
    submitBtn.disabled = true;
    fetch("/api/login", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: password })
    }).then(function (res) {
      if (res.ok) {
        location.replace(adminMode ? "/admin" : safeNext(params.get("next"), location.origin));
        return;
      }
      if (res.status === 401) {
        showError("รหัสผ่านไม่ถูกต้อง");
      } else {
        showError("เข้าสู่ระบบไม่สำเร็จ โปรดลองอีกครั้ง");
      }
      submitBtn.disabled = false;
      passwordInput.select();
    }, function () {
      showError("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ โปรดลองอีกครั้ง");
      submitBtn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
